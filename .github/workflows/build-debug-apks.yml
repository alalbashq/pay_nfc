name: Build Ghallah Debug APKs

on:
  push:
    branches: [main, vue-capacitor]
    paths:
      - .github/workflows/build-debug-apks.yml
      - 'apps/**'
      - 'packages/**'
      - 'web/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'package*.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx1536m -Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint, and build
        run: gradle :core:testDebugUnitTest :pos:lintDebug :pay:lintDebug :pos:assembleDebug :pay:assembleDebug
      - name: Assemble APKs if checks stop the build
        if: failure()
        run: gradle :pos:assembleDebug :pay:assembleDebug
      - name: Verify and name APKs
        if: "!cancelled()"
        run: |
          mkdir -p artifacts
          cp apps/ghallah-pos/android/build/outputs/apk/debug/pos-debug.apk artifacts/Ghallah-POS-debug.apk
          cp apps/ghallah-pay/android/build/outputs/apk/debug/pay-debug.apk artifacts/Ghallah-Pay-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/Ghallah-POS-debug.apk | grep -F "package: name='com.ghallah.pos'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/Ghallah-Pay-debug.apk | grep -F "package: name='com.ghallah.pay'"
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: Ghallah-Debug-APKs
          path: artifacts/*.apk
          if-no-files-found: error
